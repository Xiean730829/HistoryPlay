fact_grade: C
narration: >-
  骑马俑让人想到出行和传信，但它的馆藏年代只说明它属于唐代，并不能证明它见过626年的宫门事件。许青听见城门方向传来几种互不相同的说法：“有人说自己什么都知道，有人只说听见了动静。我不知道该先信哪一句。”
