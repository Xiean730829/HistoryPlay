narration: >-
  621年，修补匠许谨接下一件活。顾客怕修得不合用，许谨担心忙完以后拿不到说好的报酬。两人都想把事情做好，却还没说清要修到什么样、何时交付。许谨问你：我们先查什么，才能开始谈？人物和交易情境均为现代创作。
