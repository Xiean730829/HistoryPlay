narration: >-
  时间线把后来的事另列一格：690年，武则天称帝，国号由唐改为周；705年，国号又恢复为唐。它们不是这块678年造像碑记录的同一时刻。把三年放在前后顺序里，才看得出后来发生的事如何改变人们回望这件物证的方式。
