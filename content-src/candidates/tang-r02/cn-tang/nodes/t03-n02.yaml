narration: >-
  馆方说明指出，这件造像碑的铭文把唐高宗与皇后武氏列为功德对象。678年，她的身份是皇后；这条物证显示她受到怎样的礼敬，却不能证明她当时已经称帝。可先记下铭文与年代，也可以继续查看后来身份和国号怎样变化。
