  time_range:
    start_year: 700
    end_year: 750
    precision: range
    display_label: 8世纪前半叶
    uncertainty: 采用现有资料给出的八世纪前半叶；馆藏号暂标不详，不推定窑口或本件装过什么。
  placement_basis: 骑马俑之后安排一件三彩龙柄双耳瓶，从出行主题转到器形与工艺；馆藏号暂标不详，后续再改，这是策展顺序，不是制作年代排序。
  artifact_id: cn.tang.artifact.dragon-amphora
  side: center
