  artifact_id: cn.tang.artifact.kaiyuan-coin
  side: left
- id: cn.tang.station.ox
  order: 2
  time_range:
    start_year: 700
    end_year: 799
    precision: century
    display_label: 8世纪
    uncertainty: 馆方给出世纪级断代，不推定具体年份。
  placement_basis: 与开元通宝本件的断代区间重叠，稳定排在钱币之后；这是策展顺序，不是制作年代排序。
  artifact_id: cn.tang.artifact.gilt-bronze-bull
  side: right
- id: cn.tang.station.lute
