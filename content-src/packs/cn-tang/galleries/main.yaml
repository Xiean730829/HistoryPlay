  artifact_id: cn.tang.artifact.bronze-mirror
  side: center
- id: cn.tang.station.equestrian-pair
  order: 10
  time_range:
    start_year: 618
    end_year: 906
    precision: range
    display_label: 唐代，618—906年
    uncertainty: 馆方给出唐朝区间，不推定具体年份。
  placement_basis: 铜镜之后安排一对骑马俑；两件须同框观察，驿卒旅途是创作，不能断言真俑是驿使，这是策展顺序。
  artifact_id: cn.tang.artifact.equestrian-pair
  side: left
- id: cn.tang.station.dragon-amphora
