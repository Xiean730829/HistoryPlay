id: cn.tang.gallery.main
title: 唐朝长廊
region:
  id: cn
  label: 中国
status: open
default_station_id: cn.tang.station.stele
stations:
- id: cn.tang.station.stele
  order: 0
  time_range:
    start_year: 678
    end_year: 678
    precision: year
    display_label: 678年
  placement_basis: 以有明确纪年依据的造像碑作为长廊入口，连接可核查的实物年代与稍后的历史背景。
  artifact_id: cn.tang.artifact.votive-stele
  side: center
- id: cn.tang.station.coin
  order: 1
  time_range:
    start_year: 718
    end_year: 732
    precision: range
    display_label: 本件：718—732年
  placement_basis: 钱币个体断代与卧牛的八世纪区间重叠；按故事主题安排在卧牛之前，不宣称两件物品的制作先后。
  artifact_id: cn.tang.artifact.kaiyuan-coin
  side: left
- id: cn.tang.station.ox
  order: 2
  time_range:
    start_year: 700
    end_year: 799
    precision: century
    display_label: 8世纪
    uncertainty: 馆方给出世纪级断代，不推定具体年份。
  placement_basis: 与开元通宝本件的断代区间重叠，稳定排在钱币之后；这是策展顺序，不是制作年代排序。
  artifact_id: cn.tang.artifact.gilt-bronze-bull
  side: right
- id: cn.tang.station.lute
  order: 3
  time_range:
    start_year: 618
    end_year: 906
    precision: range
    display_label: 唐代，618—906年
    uncertainty: 馆方给出唐朝区间，不推定具体年份。
  placement_basis: 接在旧三物之后，按开元生活与乐舞主题扩展弹拨乐俑；这是策展顺序，不是制作年代排序。
  artifact_id: cn.tang.artifact.lute-musician
  side: center
- id: cn.tang.station.flute
  order: 4
  time_range:
    start_year: 618
    end_year: 906
    precision: range
    display_label: 唐代，618—906年
    uncertainty: 馆方给出唐朝区间，不推定具体年份。
  placement_basis: 接在弹拨乐俑之后，同属乐舞主题但馆藏号不同；这是策展顺序，不是两件曾经同台的证据。
  artifact_id: cn.tang.artifact.flute-musician
  side: left
- id: cn.tang.station.mia-woman
  order: 5
  time_range:
    start_year: 618
    end_year: 906
    precision: range
    display_label: 唐代，618—906年
    uncertainty: 馆方给出唐朝区间，不推定具体年份，也不指认已知宫女。
  placement_basis: 乐俑之后观察服饰与身份未知的女俑；不与其他女俑串馆藏号，这是策展顺序。
  artifact_id: cn.tang.artifact.woman-figure-mia
  side: right
- id: cn.tang.station.follower
  order: 6
  time_range:
    start_year: 701
    end_year: 800
    precision: century
    display_label: 8世纪晚期
    uncertainty: 馆方断代为八世纪晚期，不推定具体年份。
  placement_basis: 从人物俑转到石上动作；与造像碑主题相近但不占用“佛像”口令，这是策展顺序。
  artifact_id: cn.tang.artifact.buddha-follower
  side: center
- id: cn.tang.station.dvarapala
  order: 7
  time_range:
    start_year: 701
    end_year: 800
    precision: century
    display_label: 8世纪
    uncertainty: 馆方断代为八世纪，不推定具体年份。
  placement_basis: 浮雕之后安排寺院入口守护像；与镇墓兽、力士头像主题区分，这是策展顺序。
  artifact_id: cn.tang.artifact.dvarapala
  side: left
