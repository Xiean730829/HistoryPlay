narration: 先看这件明尼阿波利斯艺术博物馆的女俑，馆藏号50.46.182。馆方断代为唐代618到906年，称它是女性人物俑，没有记录姓名。画面是创作的观察情境：讲解员对着衣着示意图，说明姿态可以描述，描述不等于已经核实的身份。这不是馆藏陶俑的真实墓葬现场，也不能把眼前的俑直接认作已知宫女。
