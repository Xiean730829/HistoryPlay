narration: 这枚开元通宝的馆藏记录将钱币本身断代为718至732年。另一个常见年份621年说的是这一钱币类型的初铸时间，不是眼前这枚钱。画面是创作的市集用钱场景，钱文与本件馆藏钱币不是同一枚。
