narration: 先看这件砂岩浮雕上还能辨认的动作。馆方将它断代为八世纪晚期，馆藏号99.174.3，并说明画面表现佛陀抚触随从头部。画面是创作的观察情境：讲解员指出坐佛姿态，并用手势示意距离，不是把残石补全后的原貌。残损要保留，不要把缺失的部分画回去当成真物。
