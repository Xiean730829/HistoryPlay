narration: 创作故事把镜头转向另一位伙伴。门廊下，吹笛的男子停住呼吸，旁边的女子正和他商量何时起奏。这不是刚才那间室内，也不是同一位弹拨女子，更不是明尼阿波利斯另一件吹笛乐俑的真实主人。乐器发声之前，他们先要知道对方准备好了。这里的人物是虚构的，不能当成馆藏乐俑曾经同台演出的证据。
