  teaser: 南宋末年，文天祥在艰难处境中写下《过零丁洋》。诗里有风雨，也有他不愿放弃的信念。
  background_node_id: cn.song.node.passing-lingding.intro
  printed_text:
    body: '辛苦遭逢起一经，干戈寥落四周星。

      山河破碎风飘絮，身世浮沉雨打萍。

      惶恐滩头说惶恐，零丁洋里叹零丁。

      人生自古谁无死？留取丹心照汗青。'
    script_status: printed_not_handwriting
    source_label: 传世文本现代排印，非作者手迹
    interpretation_label: 排印全文，不是手迹。
