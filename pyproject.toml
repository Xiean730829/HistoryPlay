[project]
name = "history-play-workspace"
version = "0.1.0"
description = "Development workspace for the Time-Space Museum"
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = [
  "services/museum",
  "services/mcp-gateway",
  "services/voice-bridge",
  "packages/contracts-python",
  "tools/content-pipeline",
]

[dependency-groups]
dev = [
  "jsonschema>=4.23,<5",
  "pytest>=8.3,<9",
  "ruff>=0.11,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
"packages/contracts-python/src/museum_contracts/models.py" = ["E501"]
