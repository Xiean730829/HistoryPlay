[project]
name = "museum-content-pipeline"
version = "0.1.0"
description = "Authoring validation and pack build for the Time-Space Museum"
requires-python = ">=3.12"
dependencies = [
  "jsonschema>=4.23,<5",
  "pyyaml>=6.0,<7",
  "referencing>=0.35,<1",
]

[project.scripts]
content-pipeline = "content_pipeline.cli:main"

[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/content_pipeline"]
