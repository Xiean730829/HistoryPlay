[project]
name = "museum-mcp-gateway"
version = "0.1.0"
description = "Bound, HTTP-only museum tools for Xiaozhi MCP"
requires-python = ">=3.12"
dependencies = ["mcp==1.26.0", "aiohttp==3.14.5"]

[project.scripts]
museum-mcp = "museum_mcp.server:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/museum_mcp"]
